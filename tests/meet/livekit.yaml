# The local LiveKit server for the Meet tests: development settings, plus webhooks to the site (as LiveKit Cloud sends them)
port: 7880
bind_addresses: ["127.0.0.1"]
rtc: { tcp_port: 7881, port_range_start: 50000, port_range_end: 60000, use_external_ip: false }
keys: { devkey: secret }
webhook: { api_key: devkey, urls: ["http://localhost:3000/api/meet/livekit"] }
